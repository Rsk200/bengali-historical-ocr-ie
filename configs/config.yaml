seed: 42
dpi: 300
pdf_filename: "Secondary (BV)-2026_Class 9-10_BGS_compressed (1).pdf"
pdf_page_offset: 5
one_file_per_page: true
test_set_read_only: true

# Chapters configuration for corpus extraction
chapters:
  ch01:
    name: "Chapter 1"
    split: "dev"
    ranges:
      - start_book_page: 1
        end_book_page: 11
        page_type: "core_prose"
      - start_book_page: 12
        end_book_page: 13
        page_type: "exercise"
  ch02:
    name: "Chapter 2"
    split: "test"
    ranges:
      - start_book_page: 14
        end_book_page: 24
        page_type: "core_prose"
      - start_book_page: 25
        end_book_page: 25
        page_type: "exercise"
  ch08:
    name: "Chapter 8"
    split: "test"
    ranges:
      - start_book_page: 98
        end_book_page: 105
        page_type: "core_prose"
      - start_book_page: 106
        end_book_page: 106
        page_type: "exercise"
  ch09:
    name: "Chapter 9"
    split: "test"
    ranges:
      - start_book_page: 107
        end_book_page: 114
        page_type: "core_prose"
      - start_book_page: 115
        end_book_page: 116
        page_type: "exercise"

# Bangla Unicode normalisation settings
normalisation:
  unicode_nfc: true
  unify_nukta: true
  clean_zwj_zwnj: true
  digits: "bangla"  # "bangla", "western", or "none"
  standardise_punct_whitespace: true
  strip_suffixes_for_matching: false  # Dedicated for entity matching

# OpenCV image pre-processing switches
preprocessing:
  mode: "custom"  # "raw" bypasses all pre-processing
  to_greyscale: true
  median_blur:
    enabled: false
    ksize: 3
  clahe:
    enabled: false
    clip_limit: 2.0
    tile_grid_size: [8, 8]
  otsu_binarisation:
    enabled: false
  deskew:
    enabled: false
    max_angle_deg: 10.0

# Chunking strategies configuration
chunking:
  strategy: "S1"  # "S1" (structure-aware), "S2" (fixed with 10% overlap), or "S3" (sentence-level)
  max_chars: 2500
  overlap_chars: 250

# LLM Extraction configuration
extraction:
  model_name: "gemini-1.5-pro"
  temperature: 0.0
  max_retries: 3
  shot_mode: "zero_shot"  # "zero_shot" or "few_shot"
  extraction_mode: "joint"  # "joint" or "per_type"
